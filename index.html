<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naruto: Duelo Shinobi</title>
<style>
:root{--bg:#e9edf2;--card:#fff;--tx:#14202e;--mut:#5b6b7c;--ac:#c2410c;--ln:#cfd7e0;--hp:#c2410c;--ck:#1d6fb8;--ag:#2b8a4b;--ov:rgba(20,32,46,.55);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#17222f;--tx:#e8eef5;--mut:#8fa1b3;--ac:#ff8a3d;--ln:#2a3a4c;--hp:#ff6b3d;--ck:#4aa8ff;--ag:#5fd08a;--ov:rgba(0,0,0,.65)}}
:root[data-theme="dark"]{--bg:#0e1621;--card:#17222f;--tx:#e8eef5;--mut:#8fa1b3;--ac:#ff8a3d;--ln:#2a3a4c;--hp:#ff6b3d;--ck:#4aa8ff;--ag:#5fd08a;--ov:rgba(0,0,0,.65)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 "Trebuchet MS","Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:10px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:16px;margin:14px 0 6px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px;margin-bottom:8px}
.card.me{border-left:4px solid var(--ck)}.card.ai{border-left:4px solid var(--hp)}.card.on{outline:2px solid var(--ac)}
.nm{font-weight:700;display:flex;justify-content:space-between}
.br{position:relative;height:17px;background:var(--ln);border-radius:4px;margin:3px 0;overflow:hidden;font-size:11px}
.br i{position:absolute;left:0;top:0;bottom:0;opacity:.85}.br span{position:relative;z-index:1;padding-left:6px;color:var(--tx);line-height:17px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.chips u{text-decoration:none;font-size:11px;background:var(--ln);padding:1px 7px;border-radius:9px}
#log{height:130px;overflow-y:auto;font-size:13px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px 8px;margin-bottom:8px}
#log p{margin:2px 0}#log p.m{color:var(--mut)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:10px;min-height:44px;text-align:left;width:100%;margin-bottom:6px}
button b{display:block}button small{display:block;color:var(--mut);font-size:12px}
button:disabled{opacity:.45}button.go{background:var(--ac);color:#fff;border-color:var(--ac);text-align:center;font-weight:700}
button.sel{border:2px solid var(--ac)}
.maintenance{display:block;color:var(--mut);font-size:11px;margin-top:4px}
.tech{margin:0 0 6px}.tech button{margin-bottom:0}.tech details,.passives{font-size:12px;color:var(--mut);padding:4px 8px}.tech details p{margin:4px 0 8px;color:var(--tx)}
summary{cursor:pointer;color:var(--ac);font-weight:700}.passives ul{margin:4px 0;padding-left:20px;color:var(--tx)}
.clonecount,.check,.speed{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;margin:6px 0;font-size:13px}.clonecount select,.speed select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:7px}.check{justify-content:flex-start}.check input{width:20px;height:20px;accent-color:var(--ac)}
.row{display:flex;gap:6px}.row button{text-align:center}
.ov{position:fixed;inset:0;background:var(--ov);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.ov>div{background:var(--bg);width:100%;max-width:560px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 0 0}
.win{font-size:18px;font-weight:700;text-align:center;margin:10px 0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body><div id="app"></div>
<script type="module" src="js/main.js"></script>
</body></html>
